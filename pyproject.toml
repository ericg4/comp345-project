[project]
name = "shortcut-learning-project"
version = "0.1.0"
description = "Shortcut learning in skin lesion classifiers: CNN vs. PanDerm vs. VLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle",
    "gdown",
    "numpy",
    "pandas",
    "pillow",
    "scikit-learn",
    "torch",
    "torchvision",
    # Pinned to the version PanDerm's classification code was written against.
    "timm==0.9.16",
    "tqdm",
]

[project.optional-dependencies]
vlm = [
    "transformers==4.57.1",
    "peft==0.17.1",
    "accelerate==1.11.0",
    "safetensors==0.6.2",
]

[tool.uv]
package = false
